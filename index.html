<!doctype html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- TODO:MAJD AZ OLDAL VÉGÉN LEGYEN BELINKELVE AZ OSSZESITETT JS FILE!!! -->
    <script src="marci.js"></script>
    <script src="beni.js"></script>
  </head>
  <body>
    <!-- ELSO -->
     <div class="my-5 border rounded-md bg-orange-200 mx-10">
        <div class="mx-auto bg-slate-500 rounded-lg border border-slate-300 text-center w-fit p-3 m-5">
        <div class="mb-2 border-b-2">
          <h1 class="text-2xl font-bold">1. Relatív prímek</h1>
        </div>
        <form>
          <label for="szam1" class="text-lg">Add meg a számot [2, 100] intervallumból: </label>
          <input type="number" name="szam1" id="szam1" class="border-2 p-1 bg-gray-100">
          <button onclick="relativ_primek()" type="button" class="border-2 text-lg p-1 mx-2 cursor-pointer bg-gray-300" id="primes_button">Számolásra fel!</button>
        </form>
        <div>
          <h2 class="text-lg font-bold">A relatív prímek listája 2-től 100-ig:</h2>
          <div id="primes_div" class="flex flex-wrap w-300">

          </div>
        </div>
      </div>
     </div>

    <!-- MASODIK -->
    <div class="my-5 border rounded-md bg-orange-200 mx-10">
      <div
        id="chairGameInit"
        class="mx-auto bg-slate-500 rounded-lg border border-slate-300 text-center w-fit p-3 m-5"
      >
        <p class="mx-auto">Adja meg a játékosok neveit:</p>
        <br />
        <form action="">
          <label for="chairGamePlayer1">Első játékos neve:</label
          ><input
            type="text"
            name=""
            id="chairGamePlayer1"
            class="w-fit bg-gray-300 border rounded-md ml-1  p-0.5"
            value=""
          />
          <label for="chairGamePlayer2">Második játékos neve:</label
          ><input
            type="text"
            name=""
            id="chairGamePlayer2"
            class="w-fit bg-gray-300 border rounded-md ml-1 p-0.5"
            value=""
          />
          <br />
          <label for="chairGameNumberInput">Székek száma:</label
          ><input
            class="w-fit bg-gray-300 border rounded-md mt-2 ml-0 p-0.5"
            type="number"
            name=""
            id="chairGameNumberInput"
            min="10"
            max="20"
            value="10"
          />
        </form>
        <br />
        <button
          class="bg-green-500 p-1 mt-3 rounded-md border border-green-700 hover:bg-green-400 hover:border-green-600 cursor-pointer"
          onclick="canStartChairGame()"
        >
          Indítás
        </button>
      </div>
      <div id="chairsDiv" class="hidden flex"></div>
      <div id="chairGameOverDiv" class="w-fit text-xl m-5 text-center mx-auto hidden">Első játékos pontjai: <p id="chairGamePointsForPlayer1" class=""></p><br>Második játékos pontjai: <p id="chairGamePointsForPlayer2" class=""></p></div>
    </div>
    <!-- HARMADIK -->
    <canvas id="piros" width="500" height="300"></canvas>
    <p id="piros_win"></p>
    <input id="piros_speed" type="number" min="0.1" max="0.7" step="0.05" value="0.5"/>
    <button onclick="if(piros==null) piros=piros_init()">start</button>
    <!-- NEGYEDIK -->
    <div class="my-5 border rounded-md bg-orange-200 mx-10">
      <div class="mx-auto bg-slate-500 rounded-lg border border-slate-300 text-center w-fit p-3 m-5">
        <div class="mb-2 border-b-2">
          <h1 class="text-2xl font-bold">4. Séta</h1>
        </div>
        <div class="bg-gray-500 border-2 rounded-sm p-2">
            <button onclick="if(seta==null) seta=seta_init()">start</button>
            <input type="number" name="seta_map_size" id="seta_map_size" min="10" max="30" value="15">
            <input id="seta_wait" type="number" min="0.1" max="3" step="0.05" value="0.5"/>
             <table id="seta_map"></table>
          </div>
        </div>
      </div>
    </div>
    <!-- ÖTÖDIK -->
    <div class="my-5 border rounded-md bg-orange-200 mx-10">
      <div class="mx-auto bg-slate-500 rounded-lg border border-slate-300 text-center w-fit p-3 m-5">
        <div class="mb-2 border-b-2">
          <h1 class="text-2xl font-bold">5. BOMBAAA</h1>
        </div>
        <div class="bg-gray-500 border-2 rounded-sm p-2">
          <div>
            <label for="wire_count">Vezetékek száma:</label>
            <input type="number" name="wire_count" id="wire_count">
          </div>
          <div id="wire_div" class="flex justify-around">
            
          </div>
          <div id="end"></div>
        </div>
      </div>
    </div>

    <!-- HATODIK -->
    <div id="memoryGameWinDiv" class="my-5 border rounded-md bg-orange-200 mx-10 flex"><div class="hidden"><p>Nyertél!</p><br><p>Időd: <span id="memoryGameWinTime"></span></p> </div>
    <div id="memoryGameMainDiv" class="bg-slate-500 rounded-lg border border-slate-300 text-center w-fit p-3 m-5 mx-auto"><canvas width="500" height="500" id="memoryGame" class="border"></canvas>  <div id="memoryGameInitDiv" class="mx-auto"><label for="memoryGameDifficulty">Nehézség: </label>
        <input type="number" min="5" max="9" name="" id="memoryGameDifficulty">
        <button class="" onclick="initMemoryGame()">Kezdés!</button>
    </div></div>
   
    </div>
  </body>
  <script src="vince.js"></script>
</html>
