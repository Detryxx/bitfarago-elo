<!doctype html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="marci.js"></script>
    <script src="beni.js"></script>
    <script src="vince.js"></script>
  </head>
  <body>
    <!-- ELSO -->

    <!-- MASODIK -->
    <div class="my-5 border rounded-md bg-orange-200 mx-10">
      <div
        id="chairGameInit"
        class="mx-auto bg-slate-500 rounded-lg border border-slate-300 text-center w-fit p-3 m-5"
      >
        <p class="mx-auto">Adja meg a játékosok neveit:</p>
        <br />
        <form action="">
          <label for="chairGamePlayer1">Első játékos neve:</label
          ><input
            type="text"
            name=""
            id="chairGamePlayer1"
            class="w-fit bg-gray-300 border rounded-md ml-1"
            value=""
          />
          <label for="chairGamePlayer2">Második játékos neve:</label
          ><input
            type="text"
            name=""
            id="chairGamePlayer2"
            class="w-fit bg-gray-300 border rounded-md ml-1"
            value=""
          />
          <br />
          <label for="chairGameNumberInput">Székek száma:</label
          ><input
            class="w-fit bg-gray-300 border rounded-md mt-2 ml-1"
            type="number"
            name=""
            id="chairGameNumberInput"
            min="10"
            max="20"
            value="10"
          />
        </form>
        <br />
        <button
          class="bg-green-500 p-1 mt-3 rounded-md border border-green-700 hover:bg-green-400 hover:border-green-600 cursor-pointer"
          onclick="canStartChairGame()"
        >
          Indítás
        </button>
      </div>
      <div id="chairsDiv" class="hidden flex"></div>
    </div>
    <!-- HARMADIK -->
    <canvas width="500"></canvas>
  </body>
  <script src=""></script>
</html>
